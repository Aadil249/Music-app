name: Build & Package Android APK + AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CustomMusicUI_Android_v2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK & App Bundle (AAB)
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Upload Debug APK (Ready to Install)
        uses: actions/upload-artifact@v4
        with:
          name: CustomMusicUI-v2-debug-apk
          path: CustomMusicUI_Android_v2/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: CustomMusicUI-v2-release-bundle
          path: |
            CustomMusicUI_Android_v2/app/build/outputs/apk/release/*.apk
            CustomMusicUI_Android_v2/app/build/outputs/bundle/release/*.aab
